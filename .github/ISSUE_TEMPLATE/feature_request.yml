name: Feature request
description: 提出一个功能建议（Suggest a feature）
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 Scenario
      description: 先说你在什么场景下卡住了，比直接说"加个 XX 功能"更容易被采纳。
      placeholder: "我在面试录音里要按说话人导出文稿，现在只能整段复制……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作 Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你现在的替代做法 Workarounds
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块 Area
      options:
        - 录音 / 速记
        - 转写 / 模型
        - 检索 / 时间流
        - 说话人分离
        - AI / A2A
        - 局域网同步
        - 界面 / 交互
        - 打包 / 安装
        - 文档 / 其他
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 这个功能符合"数据不出本机"的设计前提
          required: true
